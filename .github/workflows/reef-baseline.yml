name: baseline
on: [workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # hatch-vcs needs tags, or version derives 0.1.dev1
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pip install --group test
      - run: python -m pytest --junit-xml=junit.xml -p no:cacheprovider -p no:randomly -o addopts=
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: junit, path: junit.xml }
